name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ "admin/**", "site/**", "docs/**", "*.md" ]
  pull_request:
    paths-ignore: [ "admin/**" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "ابنِ نسخة Release موقّعة (APK + AAB) — تحتاج Secrets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Apply branding (optional logo)
        run: bash tools/apply-branding.sh

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle --no-daemon --stacktrace testDebugUnitTest -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Write build report
        if: always()
        run: |
          {
            echo "Bawabat Alorood - BUILD REPORT"
            echo "Commit : ${GITHUB_SHA}"
            echo "Date   : $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "Version: $(grep VERSION_NAME version.properties | cut -d= -f2) (code $(grep VERSION_CODE version.properties | cut -d= -f2))"
            echo "Unit tests outcome: ${{ steps.tests.outcome }}"
            echo "APK files:"
            ls -la app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "  (no APK produced)"
          } | tee BUILD-REPORT.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bawabat-alorood-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            BUILD-REPORT.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Signed release (APK + AAB)
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. See docs/RELEASE.md (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Apply branding (optional logo)
        run: bash tools/apply-branding.sh

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build release APK and AAB
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: bawabat-alorood-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
